name: Verify QubitYield

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --extra dev --extra research
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Static checks
        run: ruff check src tests scripts
      - name: Scientific, financial, and API tests
        run: pytest
      - name: Dashboard tests
        working-directory: web
        run: npm test
      - name: Reproduce scientific evidence
        run: |
          qubityield reproduce
          python scripts/validate_qiskit.py
          python scripts/execute_notebook.py
      - name: Build dashboard and offline preview
        working-directory: web
        run: |
          npm run build
          npm run build:preview
          npm run test:preview
      - name: Exercise the real TypeScript client and local engine
        run: |
          QY_SMOKE_DATA="$(mktemp -d)"
          QUBITYIELD_DATA_DIR="$QY_SMOKE_DATA" qubityield serve --port 8766 &
          QY_SMOKE_PID=$!
          trap 'kill "$QY_SMOKE_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8766/api/health', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise RuntimeError('Disposable test engine did not start')
          PY
          node web/scripts/smoke-engine.mjs http://127.0.0.1:8766
      - name: Record artifact integrity
        run: |
          python scripts/build_manifest.py
          qubityield verify-manifest
      - uses: actions/upload-artifact@v4
        with:
          name: verified-evidence
          path: |
            artifacts/
            notebooks/
            web/preview/index.html
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload verified demo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/preview

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified demo
        id: deployment
        uses: actions/deploy-pages@v4

