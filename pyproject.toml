[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "qubityield"
version = "0.2.0"
description = "A reproducible quantum hardware investment decision workbench."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jasper Sands"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
  "matplotlib>=3.8,<4",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]
research = ["qiskit>=2.0,<3", "qiskit-aer>=0.17,<0.19", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "pandas>=2.2,<4"]

[project.scripts]
qubityield = "qubityield.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qubityield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

